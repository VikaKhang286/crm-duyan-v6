name: DAC Mockup Preview

on:
  push:
    branches: [feat/ui-mockup-workflow]
    paths: ["mockup/**", ".github/workflows/mockup-preview.yml"]
  pull_request:
    paths: ["mockup/**", ".github/workflows/mockup-preview.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mockup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix mockup run check
      - run: npm --prefix mockup run test:changelog
      - run: npm --prefix mockup run change:verify
      - run: npm --prefix mockup run build
      - uses: actions/upload-artifact@v4
        with:
          name: dac-mockup-preview
          path: mockup/dist
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.MOCKUP_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: mockup/dist

  deploy:
    if: github.event_name != 'pull_request' && vars.MOCKUP_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy mockup to Pages
        id: deployment
        uses: actions/deploy-pages@v4
